name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # Chromium for export: cached per Playwright version, so later runs skip the download.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install chromium
      - name: Install Chromium's system libraries
        if: runner.os == 'Linux'
        run: npx playwright-core install-deps chromium

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Render the examples with the CLI
        run: |
          node dist/cli.js build "examples/*.archt" -o out/
          node dist/cli.js export "out/*.excalidraw" -f png --scale 2 -o out/
          node dist/cli.js export "out/*.excalidraw" -f svg -o out/
          ls -l out
      - name: Upload the rendered examples
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: examples
          path: out/
