name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # Chromium for export: cached per Playwright version, so later runs skip the download.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install chromium
      - name: Install Chromium's system libraries
        if: runner.os == 'Linux'
        run: npx playwright-core install-deps chromium

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Install the packed tarball and render with it
        run: |
          mkdir "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          npm install -g --no-audit --no-fund --prefix "$RUNNER_TEMP/global" "$RUNNER_TEMP"/pack/arch-text-*.tgz
          bin="$RUNNER_TEMP/global/bin"
          [ "$RUNNER_OS" = Windows ] && bin="$RUNNER_TEMP/global"
          test "$("$bin/arch-text" --version)" = "$(node -p "require('./package.json').version")"
          mkdir "$RUNNER_TEMP/smoke" && cp -r examples/. "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          "$bin/arch-text" render "*.archt" -f svg,png
          "$bin/arch-text" render "*.archt" -f svg,png --check
          ls -l *.svg *.png

      - name: Render the examples with the CLI
        run: |
          node dist/cli.js build "examples/*.archt" -o out/
          node dist/cli.js export "out/*.excalidraw" -f png --scale 2 -o out/
          node dist/cli.js export "out/*.excalidraw" -f svg -o out/
          ls -l out
      - name: Upload the rendered examples
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: examples
          path: out/

  docker:
    name: Docker image and action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t arch-text:ci .
      - name: Render every example offline, as another user, twice
        run: bash scripts/docker-check.sh arch-text:ci

      # The sample docs repository's committed SVG must be exactly what the image makes.
      - name: The action in check mode, on the sample docs repository
        uses: ./
        with:
          image: arch-text:ci
          working-directory: examples/docs-repo
      - name: The action in write mode
        uses: ./
        with:
          mode: write
          image: arch-text:ci
          working-directory: examples/docs-repo
      - name: Write mode left no diff
        run: git diff --exit-code

      - name: Make the sample out of date
        run: echo "system Billing" >> examples/docs-repo/docs/architecture/platform.archt
      - id: stale
        name: The action in check mode, on the stale sample
        uses: ./
        continue-on-error: true
        with:
          image: arch-text:ci
          working-directory: examples/docs-repo
      - name: Check mode failed and reported the change
        run: |
          test "${{ steps.stale.outcome }}" = failure
          test "${{ steps.stale.outputs.changed }}" = true
